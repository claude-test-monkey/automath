<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automath - Math Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 60px;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 40px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .options {
            margin-bottom: 50px;
        }

        .option-group {
            margin-bottom: 40px;
        }

        .option-group label {
            display: block;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #666;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button.secondary {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        button.selected {
            background: #000000;
            color: #ffffff;
        }

        .problem-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 40px 0;
            width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .problem {
            font-size: 72px;
            font-weight: 300;
            line-height: 1.2;
            width: 100%;
            position: relative;
        }

        .problem-line-1 {
            text-align: right;
            padding-right: 60px;
        }

        .problem-line-2 {
            text-align: right;
            padding-right: 60px;
            position: relative;
        }

        .problem-operator {
            position: absolute;
            left: 0;
            width: 50px;
            text-align: left;
        }


        .input-container {
            width: 100%;
        }

        input[type="number"] {
            font-size: 72px;
            padding: 15px 20px;
            padding-right: 60px;
            border: none;
            border-top: 3px solid #000000;
            border-radius: 0;
            width: 100%;
            text-align: right;
            font-family: inherit;
            transition: background-color 0.2s, border-color 0.2s;
            box-sizing: border-box;
            background-color: #f5f5f5;
        }

        input[type="number"]:focus {
            outline: none;
            border-top-color: #000000;
        }

        input[type="number"].correct {
            background-color: #e8f5e9;
            border-top-color: #22c55e;
            color: #22c55e;
            caret-color: transparent;
        }

        input[type="number"].incorrect {
            background-color: #ffebee;
            border-top-color: #ef4444;
            color: #ef4444;
            caret-color: transparent;
        }

        input[type="number"]::placeholder {
            font-size: 72px;
            color: #cccccc;
        }

        input[type="number"].correct::placeholder {
            color: #22c55e;
        }

        input[type="number"].incorrect::placeholder {
            color: #ef4444;
        }

        .progress {
            font-size: 14px;
            color: #666;
            margin-top: 20px;
        }

        .results {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 60px;
            flex-wrap: wrap;
        }

        .result-item {
            margin: 0;
        }

        .result-value {
            font-size: 56px;
            font-weight: 300;
            margin-top: 10px;
        }

        .result-label {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-section {
            margin-top: 50px;
            border-top: 1px solid #ddd;
            padding-top: 30px;
        }

        .review-title {
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }

        .review-table {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border-collapse: collapse;
            font-size: 24px;
        }

        .review-table th {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            font-weight: 400;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .review-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .review-table tr.correct {
            background-color: #ffffff;
        }

        .review-table tr.incorrect {
            background-color: #ffebee;
            color: #ef4444;
        }

        .review-table .problem-col {
            text-align: left;
            padding-left: 20px;
        }

        .review-table .feedback-icon {
            font-size: 20px;
            color: #22c55e;
        }

        .review-table .feedback-icon.incorrect {
            color: #ef4444;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen" class="screen active">
            <h1>Automath</h1>

            <div class="options">
                <div class="option-group">
                    <label>Operation</label>
                    <div class="button-group">
                        <button class="secondary operation-btn" data-operation="addition">Addition</button>
                        <button class="secondary operation-btn" data-operation="subtraction">Subtraction</button>
                        <button class="secondary operation-btn" data-operation="multiplication">Multiplication</button>
                        <button class="secondary operation-btn" data-operation="division">Division</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Practice Screen -->
        <div id="practiceScreen" class="screen">
            <div class="problem-container">
                <div class="problem">
                    <div class="problem-line-1" id="problemNum1"></div>
                    <div class="problem-line-2">
                        <span class="problem-operator" id="problemOp"></span>
                        <span id="problemNum2"></span>
                    </div>
                </div>
                <div class="input-container">
                    <input type="number" id="answer" placeholder="?" autocomplete="off">
                </div>
            </div>

            <div class="progress" id="progress">Problem 1 of 15</div>
        </div>

        <!-- Results Screen -->
        <div id="resultsScreen" class="screen">
            <h2>Complete</h2>

            <div class="results">
                <div class="result-item">
                    <div class="result-label">Score</div>
                    <div class="result-value" id="scoreResult">0/10</div>
                </div>

                <div class="result-item">
                    <div class="result-label">Accuracy</div>
                    <div class="result-value" id="accuracyResult">0%</div>
                </div>

                <div class="result-item">
                    <div class="result-label">Time</div>
                    <div class="result-value" id="timeResult">0:00</div>
                </div>
            </div>

            <button id="restartBtn" style="margin-top: 40px; margin-bottom: 30px;">Practice Again</button>

            <div class="review-section">
                <div class="review-title">Review Your Work</div>
                <table class="review-table" id="reviewTable">
                    <thead>
                        <tr>
                            <th class="problem-col">Problem</th>
                            <th>Your Answer</th>
                            <th>Correct Answer</th>
                        </tr>
                    </thead>
                    <tbody id="reviewTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // State
        let selectedOperation = null;
        let currentProblem = 0;
        let totalProblems = 15;
        let correctAnswers = 0;
        let startTime = null;
        let currentDifficulty = 1; // Start at easiest level (1-4)
        let currentProblemData = null;
        let correctStreak = 0; // Track consecutive correct answers

        // Problem tracking to prevent duplicates and manage trivial problems
        let sessionProblems = []; // All problems shown this session
        let consecutiveTrivialCount = 0; // Consecutive trivial problems
        let totalTrivialCount = 0; // Total trivial problems in session
        let recentOperands = []; // Track last 2 operands used
        let sessionHistory = []; // Track all problems and answers for review

        // Elements
        const startScreen = document.getElementById('startScreen');
        const practiceScreen = document.getElementById('practiceScreen');
        const resultsScreen = document.getElementById('resultsScreen');
        const restartBtn = document.getElementById('restartBtn');
        const problemNum1El = document.getElementById('problemNum1');
        const problemNum2El = document.getElementById('problemNum2');
        const problemOpEl = document.getElementById('problemOp');
        const answerInput = document.getElementById('answer');
        const progressEl = document.getElementById('progress');

        // Operation buttons - start practice immediately when clicked
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                selectedOperation = btn.dataset.operation;
                startPractice();
            });
        });

        restartBtn.addEventListener('click', resetApp);

        // Helper function: Check if problem is trivial
        function isTrivial(num1, num2, operation) {
            if (operation === 'multiplication') return num2 === 0 || num2 === 1;
            if (operation === 'division') return num2 === 1;
            if (operation === 'addition') return num2 === 0;
            if (operation === 'subtraction') return num2 === 0;
            return false;
        }

        // Helper function: Normalize problem for duplicate checking
        // For commutative operations (addition, multiplication), order doesn't matter
        function normalizeProblem(num1, num2, operator) {
            if (operator === '+' || operator === '×') {
                // Commutative: treat (7,2) and (2,7) as same
                return `${Math.min(num1, num2)},${Math.max(num1, num2)},${operator}`;
            }
            // Non-commutative: (7,2) and (2,7) are different
            return `${num1},${num2},${operator}`;
        }

        // Helper function: Check if problem is duplicate
        function isDuplicate(num1, num2, operator) {
            const normalized = normalizeProblem(num1, num2, operator);
            return sessionProblems.includes(normalized);
        }

        // Helper function: Check if operand was used in last 2 problems
        function hasRecentOperand(num1, num2) {
            return recentOperands.includes(num1) || recentOperands.includes(num2);
        }

        function generateProblem(operation, difficultyLevel) {
            let num1, num2, answer;

            switch(operation) {
                case 'addition':
                    if (difficultyLevel === 1) {
                        // Facts within 5
                        num1 = Math.floor(Math.random() * 5) + 1;
                        num2 = Math.floor(Math.random() * (5 - num1)) + 1;
                    } else if (difficultyLevel === 2) {
                        // Facts within 10
                        num1 = Math.floor(Math.random() * 9) + 1;
                        num2 = Math.floor(Math.random() * (10 - num1)) + 1;
                    } else if (difficultyLevel === 3) {
                        // Facts within 20
                        num1 = Math.floor(Math.random() * 15) + 5;
                        num2 = Math.floor(Math.random() * 10) + 1;
                    } else {
                        // Level 4: Two-digit within 75
                        num1 = Math.floor(Math.random() * 40) + 10;
                        num2 = Math.floor(Math.random() * 30) + 5;
                    }
                    answer = num1 + num2;
                    return { num1, num2, operator: '+', answer };

                case 'subtraction':
                    if (difficultyLevel === 1) {
                        // Facts within 5
                        num1 = Math.floor(Math.random() * 4) + 2;
                        num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                    } else if (difficultyLevel === 2) {
                        // Facts within 10
                        num1 = Math.floor(Math.random() * 8) + 3;
                        num2 = Math.floor(Math.random() * (num1 - 1)) + 1;
                    } else if (difficultyLevel === 3) {
                        // Facts within 20
                        num1 = Math.floor(Math.random() * 15) + 6;
                        num2 = Math.floor(Math.random() * 10) + 1;
                    } else {
                        // Level 4: Two-digit within 75
                        num1 = Math.floor(Math.random() * 50) + 20;
                        num2 = Math.floor(Math.random() * 30) + 5;
                    }
                    answer = num1 - num2;
                    return { num1, num2, operator: '−', answer };

                case 'multiplication':
                    if (difficultyLevel === 1) {
                        // 0-2 times tables
                        num1 = Math.floor(Math.random() * 10) + 1;
                        num2 = Math.floor(Math.random() * 3);
                    } else if (difficultyLevel === 2) {
                        // 0-5 times tables
                        num1 = Math.floor(Math.random() * 10) + 1;
                        num2 = Math.floor(Math.random() * 6);
                    } else if (difficultyLevel === 3) {
                        // 0-10 times tables
                        num1 = Math.floor(Math.random() * 10) + 1;
                        num2 = Math.floor(Math.random() * 11);
                    } else {
                        // Level 4: 0-12 times tables
                        num1 = Math.floor(Math.random() * 12) + 1;
                        num2 = Math.floor(Math.random() * 13);
                    }
                    answer = num1 * num2;
                    return { num1, num2, operator: '×', answer };

                case 'division':
                    if (difficultyLevel === 1) {
                        // 0-2 times tables division
                        num2 = Math.floor(Math.random() * 2) + 1;
                        answer = Math.floor(Math.random() * 10) + 1;
                    } else if (difficultyLevel === 2) {
                        // 0-5 times tables division
                        num2 = Math.floor(Math.random() * 5) + 1;
                        answer = Math.floor(Math.random() * 10) + 1;
                    } else if (difficultyLevel === 3) {
                        // 0-10 times tables division
                        num2 = Math.floor(Math.random() * 9) + 2;
                        answer = Math.floor(Math.random() * 12) + 1;
                    } else {
                        // Level 4: 0-12 times tables division
                        num2 = Math.floor(Math.random() * 11) + 2;
                        answer = Math.floor(Math.random() * 12) + 1;
                    }
                    num1 = num2 * answer;
                    return { num1, num2, operator: '÷', answer };
            }
        }

        function startPractice() {
            currentProblem = 0;
            correctAnswers = 0;
            currentDifficulty = 1; // Start at easiest level
            correctStreak = 0;

            // Reset problem tracking
            sessionProblems = [];
            consecutiveTrivialCount = 0;
            totalTrivialCount = 0;
            recentOperands = [];
            sessionHistory = [];

            startScreen.classList.remove('active');
            practiceScreen.classList.add('active');

            startTime = Date.now();
            showNextProblem();
        }

        function showNextProblem() {
            let problem = null;
            let attempts = 0;
            const maxAttempts = 50;

            // Retry logic to generate valid problem
            while (attempts < maxAttempts) {
                problem = generateProblem(selectedOperation, currentDifficulty);
                const { num1, num2, operator } = problem;

                // Check if problem is trivial
                const trivial = isTrivial(num1, num2, selectedOperation);

                // Validation checks
                const duplicate = isDuplicate(num1, num2, operator);
                const tooManyConsecutiveTrivial = trivial && consecutiveTrivialCount >= 1;
                const tooManyTotalTrivial = trivial && totalTrivialCount >= 3;
                const sameOperandClustering = hasRecentOperand(num1, num2);

                // Accept if all checks pass
                if (!duplicate && !tooManyConsecutiveTrivial && !tooManyTotalTrivial && !sameOperandClustering) {
                    // Track this problem
                    const normalized = normalizeProblem(num1, num2, operator);
                    sessionProblems.push(normalized);

                    // Update trivial tracking
                    if (trivial) {
                        consecutiveTrivialCount++;
                        totalTrivialCount++;
                    } else {
                        consecutiveTrivialCount = 0;
                    }

                    // Update recent operands (keep last 2)
                    recentOperands.push(num1, num2);
                    if (recentOperands.length > 4) {
                        recentOperands = recentOperands.slice(-4);
                    }

                    break;
                }

                attempts++;
            }

            // Use the generated problem (or last attempt if max retries reached)
            currentProblemData = problem;
            problemNum1El.textContent = currentProblemData.num1;
            problemOpEl.textContent = currentProblemData.operator;
            problemNum2El.textContent = currentProblemData.num2;
            answerInput.value = '';
            answerInput.placeholder = '?';
            answerInput.classList.remove('correct', 'incorrect');
            answerInput.focus();
            progressEl.textContent = `Problem ${currentProblem + 1} of ${totalProblems}`;
        }

        answerInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function checkAnswer() {
            const userAnswer = parseInt(answerInput.value);

            if (isNaN(userAnswer)) return;

            const isCorrect = userAnswer === currentProblemData.answer;

            // Save to session history for review
            sessionHistory.push({
                num1: currentProblemData.num1,
                num2: currentProblemData.num2,
                operator: currentProblemData.operator,
                correctAnswer: currentProblemData.answer,
                userAnswer: userAnswer,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                // Show green checkmark in input box
                answerInput.value = '';
                answerInput.placeholder = '✓';
                answerInput.classList.add('correct');
                correctAnswers++;
                correctStreak++;

                // Increase difficulty only after 3 consecutive correct answers (max 4)
                if (correctStreak >= 3 && currentDifficulty < 4) {
                    currentDifficulty++;
                    correctStreak = 0; // Reset streak after difficulty increase
                }
            } else {
                // Show red X in input box
                answerInput.value = '';
                answerInput.placeholder = '✗';
                answerInput.classList.add('incorrect');
                correctStreak = 0; // Reset streak on wrong answer

                // Decrease difficulty immediately on wrong answer (min 1)
                if (currentDifficulty > 1) {
                    currentDifficulty--;
                }
            }

            setTimeout(() => {
                currentProblem++;
                if (currentProblem < totalProblems) {
                    showNextProblem();
                } else {
                    showResults();
                }
            }, 400);
        }

        function showResults() {
            practiceScreen.classList.remove('active');
            resultsScreen.classList.add('active');

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            const accuracy = Math.round((correctAnswers / totalProblems) * 100);

            document.getElementById('scoreResult').textContent = `${correctAnswers}/${totalProblems}`;
            document.getElementById('accuracyResult').textContent = `${accuracy}%`;
            document.getElementById('timeResult').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // Populate review table
            const reviewTableBody = document.getElementById('reviewTableBody');
            reviewTableBody.innerHTML = '';

            sessionHistory.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = item.isCorrect ? 'correct' : 'incorrect';

                // Problem column
                const problemCell = document.createElement('td');
                problemCell.className = 'problem-col';
                problemCell.textContent = `${item.num1} ${item.operator} ${item.num2} =`;
                row.appendChild(problemCell);

                // Your Answer column
                const answerCell = document.createElement('td');
                answerCell.textContent = item.userAnswer;
                row.appendChild(answerCell);

                // Correct Answer column
                const correctCell = document.createElement('td');
                if (item.isCorrect) {
                    correctCell.innerHTML = '<span class="feedback-icon">✓</span>';
                } else {
                    correctCell.textContent = item.correctAnswer;
                    correctCell.style.color = '#000000';
                }
                row.appendChild(correctCell);

                reviewTableBody.appendChild(row);
            });
        }

        function resetApp() {
            resultsScreen.classList.remove('active');
            startScreen.classList.add('active');

            selectedOperation = null;
            currentDifficulty = 1;
            correctStreak = 0;

            // Clear problem tracking
            sessionProblems = [];
            consecutiveTrivialCount = 0;
            totalTrivialCount = 0;
            recentOperands = [];
            sessionHistory = [];
        }
    </script>
</body>
</html>
